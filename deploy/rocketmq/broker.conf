# 本地单 Broker 集群标识；Dashboard 与 mqadmin 使用该名称展示集群。
brokerClusterName=DefaultCluster
# 本地 Broker 名称，检查集群状态时应显示为 broker-a。
brokerName=broker-a
brokerId=0
listenPort=10911
# 禁止业务发送时隐式创建 Topic，必须由 scripts/docker-start.sh 显式初始化。
autoCreateTopicEnable=false
autoCreateSubscriptionGroup=true
# 本地开发优先吞吐，生产环境需按持久化与可靠性要求单独配置。
flushDiskType=ASYNC_FLUSH

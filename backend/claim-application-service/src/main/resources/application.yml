server:
  port: 8081

spring:
  application:
    name: claim-application-service
  profiles:
    default: local
  cloud:
    nacos:
      # 注册中心与配置中心开关默认开启，本地联调由 local 文档关闭。
      discovery:
        enabled: ${CLAIM_APPLICATION_NACOS_DISCOVERY_ENABLED:true}
      config:
        enabled: ${CLAIM_APPLICATION_NACOS_CONFIG_ENABLED:true}
        import-check:
          enabled: ${CLAIM_APPLICATION_NACOS_CONFIG_IMPORT_CHECK_ENABLED:true}
    openfeign:
      client:
        config:
          default:
            # 外部调用收紧超时，避免消费线程长时间占用。
            connect-timeout: 1000
            read-timeout: 2000
    function:
      # 材料处理消费者以函数式绑定注册，由 binder 驱动消息接收。
      definition: materialProcess
    stream:
      rocketmq:
        binder:
          # 默认连接本地 Compose NameServer；容器化运行时通过环境变量替换为服务地址。
          name-server: ${CLAIM_APPLICATION_ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
      bindings:
        materialProcess-in-0:
          destination: claim_application_material_process_v1
          group: claim-application-material-processor-v1
          content-type: application/json
        materialProcess-out-0:
          destination: claim_application_material_process_v1
          content-type: application/json
        auditDelivery-out-0:
          destination: claim_application_audit_delivery_v1
          content-type: application/json
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 默认连接 deploy/docker-compose.yml 创建的理赔申请私有库和最小权限账号。
    url: ${CLAIM_APPLICATION_DB_URL:jdbc:mysql://127.0.0.1:3306/claim_application_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${CLAIM_APPLICATION_DB_USERNAME:claim_app}
    password: ${CLAIM_APPLICATION_DB_PASSWORD:claim_app}
    hikari:
      initialization-fail-timeout: -1
      maximum-pool-size: 5
  data:
    redis:
      # Redis 使用 Compose 初始化的 ACL 账号，不使用默认用户。
      host: ${CLAIM_APPLICATION_REDIS_HOST:127.0.0.1}
      port: ${CLAIM_APPLICATION_REDIS_PORT:6379}
      username: ${CLAIM_APPLICATION_REDIS_USERNAME:claim_app}
      password: ${CLAIM_APPLICATION_REDIS_PASSWORD:claim_redis}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Redis 是可降级依赖，就绪探针只看数据库，避免缓存故障摘除实例。
      group:
        readiness:
          include: db

claim:
  outbox:
    relay:
      # 投递调度间隔、批量与退避阈值全部由配置决定，不硬编码在代码中。
      fixed-delay-ms: ${CLAIM_APPLICATION_OUTBOX_RELAY_FIXED_DELAY_MS:2000}
      batch-size: ${CLAIM_APPLICATION_OUTBOX_RELAY_BATCH_SIZE:50}
      max-retry-count: ${CLAIM_APPLICATION_OUTBOX_RELAY_MAX_RETRY_COUNT:5}
      retry-base-seconds: ${CLAIM_APPLICATION_OUTBOX_RELAY_RETRY_BASE_SECONDS:5}
      retry-max-seconds: ${CLAIM_APPLICATION_OUTBOX_RELAY_RETRY_MAX_SECONDS:300}
  compensation:
    # 补偿调度间隔、批量与三类滞留阈值，全部由配置决定。
    fixed-delay-ms: ${CLAIM_APPLICATION_COMPENSATION_FIXED_DELAY_MS:30000}
    batch-size: ${CLAIM_APPLICATION_COMPENSATION_BATCH_SIZE:20}
    outbox-sending-timeout: ${CLAIM_APPLICATION_COMPENSATION_OUTBOX_SENDING_TIMEOUT:60s}
    accepted-stall-timeout: ${CLAIM_APPLICATION_COMPENSATION_ACCEPTED_STALL_TIMEOUT:5m}
    underwriting-timeout: ${CLAIM_APPLICATION_COMPENSATION_UNDERWRITING_TIMEOUT:1m}
  integration:
    file-system:
      # 真实文件系统地址必须显式给出：不提供默认值，缺失时出站客户端创建失败并报出该环境变量名。
      url: ${CLAIM_APPLICATION_FILE_SYSTEM_URL}
    underwriting:
      url: ${CLAIM_APPLICATION_UNDERWRITING_URL}
  mock:
    # 模拟开关默认关闭，仅本地联调显式开启；关闭时文件系统与承保的模拟接口不再注册。
    enabled: ${CLAIM_APPLICATION_MOCK_ENABLED:false}
    file-system:
      # 命中这些材料类型时模拟上传被拒绝，用于验证受理失败链路。
      fail-material-types:
        - MATERIAL_TYPE_REJECTED
      # 大于 0 时模拟文件系统响应耗时，用于验证外部调用超时。
      delay: 0ms
    underwriting:
      # 关闭后自动承保不再发送完成通知，用于验证补偿查询链路。
      notify-on-complete: true
      completion-delay: 1s

---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false

claim:
  integration:
    file-system:
      # 本地联调由本服务自带的模拟接口提供文件系统能力。
      url: http://127.0.0.1:${server.port}
    underwriting:
      url: http://127.0.0.1:${server.port}
  mock:
    enabled: true

server:
  port: 8080

spring:
  application:
    name: claim-gateway
  profiles:
    default: local
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: claim-application-service
              # 本地默认直连应用服务；部署环境通过变量切换为注册中心负载均衡地址。
              uri: ${CLAIM_APPLICATION_SERVICE_URI:http://127.0.0.1:8081}
              predicates:
                - Path=/api/application/**
            - id: claim-case-service
              uri: lb://claim-case-service
              predicates:
                - Path=/api/case/**
            - id: claim-ai-service
              uri: lb://claim-ai-service
              predicates:
                - Path=/api/diagnosis/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
    sentinel:
      enabled: false
